spring.application.name=youthservice

# H2 Database
spring.datasource.url=jdbc:h2:mem:youthservice;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Geocodificacao (ViaCEP + Nominatim/OpenStreetMap) - sem chave de API
geocodificacao.viacep.base-url=https://viacep.com.br
geocodificacao.nominatim.base-url=https://nominatim.openstreetmap.org
# Nominatim exige um User-Agent identificavel na politica de uso (https://operations.osmfoundation.org/policies/nominatim/)
geocodificacao.nominatim.user-agent=youthservice/1.0
